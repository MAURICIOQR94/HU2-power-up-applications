server:
  port: 8081
spring:
  application:
    name: "Applications"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  postgres:
    database: ${DATABASE_APP}
    host: "localhost"
    port: 5432
    username: ${USERNAME_APP}
    password: ${PASSWORD_APP}
    schema: "public"
    pool:
      initial-size: 12
      max-size: 15
      max-idle-time: 10
